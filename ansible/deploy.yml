---
# SecureNOC — Kubernetes Deployment Pipeline (used by Jenkins)
# Skips host setup, runs: Kubernetes → ELK → Monitoring
# Usage: ansible-playbook deploy.yml -v

- name: SecureNOC Kubernetes Deployment
  hosts: localhost
  connection: local
  vars:
    k8s_dir: "{{ playbook_dir }}/../k8s"
    app_namespace: securenoc
    insecure_flag: "--insecure-skip-tls-verify=true"
    rollout_timeout: "300s"
  roles:
    - k8s
    - elk
    - monitoring
