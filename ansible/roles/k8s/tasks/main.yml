---
# Role: k8s — Kubernetes deployment, rollout, and verification

- name: Check if kubectl is available
  command: which kubectl
  register: kubectl_check
  ignore_errors: true
  changed_when: false

- name: Download kubectl if not present
  shell: |
    curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    chmod +x ./kubectl
    mv ./kubectl /usr/local/bin/kubectl
  when: kubectl_check.rc != 0

- name: Create Kubernetes namespaces
  shell: kubectl apply -f {{ k8s_dir }}/namespaces.yml {{ insecure_flag }}

- name: Create vault-credentials secret (idempotent)
  shell: >
    kubectl create secret generic vault-credentials
    --namespace {{ app_namespace }}
    --from-literal=vault-token=securenoc-root-token
    --dry-run=client -o yaml | kubectl apply {{ insecure_flag }} -f -

- name: Create app-credentials secret (idempotent)
  shell: >
    kubectl create secret generic app-credentials
    --namespace {{ app_namespace }}
    --from-literal=hf-token={{ lookup('env', 'HF_TOKEN') | default('not-set', true) }}
    --dry-run=client -o yaml | kubectl apply {{ insecure_flag }} -f -

- name: Apply all Kubernetes manifests
  shell: kubectl apply -f {{ k8s_dir }}/ {{ insecure_flag }}

# --- Wait for Vault to be ready BEFORE restarting backend ---

- name: Wait for Vault pod to be ready
  shell: >
    kubectl wait --for=condition=ready pod -l app=vault
    -n {{ app_namespace }} --timeout=120s {{ insecure_flag }}
  register: vault_ready

- name: Display Vault readiness
  debug:
    var: vault_ready.stdout_lines

- name: Seed Vault with LLM credentials
  shell: >
    kubectl exec deployment/vault -n {{ app_namespace }} {{ insecure_flag }}
    -- env VAULT_ADDR=http://127.0.0.1:8200 vault kv put secret/llm-credentials
    groq_key={{ lookup('env', 'GROQ_API_KEY') }}
    hf_token={{ lookup('env', 'HF_TOKEN') | default('not-set', true) }}
  when: lookup('env', 'GROQ_API_KEY') | length > 0

# --- Now restart deployments so backend picks up seeded Vault ---

- name: Rollout restart backend deployment
  shell: kubectl rollout restart deployment backend -n {{ app_namespace }} {{ insecure_flag }}

- name: Rollout restart frontend deployment
  shell: kubectl rollout restart deployment frontend -n {{ app_namespace }} {{ insecure_flag }}

- name: Wait for backend rollout to complete
  shell: kubectl rollout status deployment/backend -n {{ app_namespace }} --timeout={{ rollout_timeout }} {{ insecure_flag }}
  register: backend_rollout

- name: Display backend rollout status
  debug:
    var: backend_rollout.stdout_lines

- name: Wait for frontend rollout to complete
  shell: kubectl rollout status deployment/frontend -n {{ app_namespace }} --timeout={{ rollout_timeout }} {{ insecure_flag }}
  register: frontend_rollout

- name: Display frontend rollout status
  debug:
    var: frontend_rollout.stdout_lines
